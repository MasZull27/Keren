<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lihat Ini!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
        }
        
        .intro {
            text-align: center;
            cursor: pointer;
        }
        
        .jumpscare {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .jumpscare-content {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }
        
        .scary-face {
            font-size: 150px;
            animation: shake 0.5s infinite;
        }
        
        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-10px, -10px) rotate(-5deg); }
            20% { transform: translate(10px, 10px) rotate(5deg); }
            30% { transform: translate(-10px, 10px) rotate(-5deg); }
            40% { transform: translate(10px, -10px) rotate(5deg); }
            50% { transform: translate(-10px, -10px) rotate(-5deg); }
            60% { transform: translate(10px, 10px) rotate(5deg); }
            70% { transform: translate(-10px, 10px) rotate(-5deg); }
            80% { transform: translate(10px, -10px) rotate(5deg); }
            90% { transform: translate(-10px, -10px) rotate(-5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        
        .message {
            font-size: 36px;
            margin-top: 20px;
            color: red;
        }
    </style>
</head>
<body>
    <div class="intro" id="intro">
        <h1>Klik untuk melihat sesuatu yang keren!</h1>
        <p>Sebuah kejutan menanti Anda...</p>
