<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lihat Ini!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
        }
        
        .intro {
            text-align: center;
            cursor: pointer;
            padding: 20px;
            border-radius: 10px;
            background-color: rgba(30, 30, 30, 0.7);
            transition: all 0.3s ease;
        }
        
        .intro:hover {
            background-color: rgba(50, 50, 50, 0.9);
        }
        
        .jumpscare {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .jumpscare-content {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }
        
        .scary-face {
            font-size: 180px;
            animation: shake 0.2s infinite;
        }
        
        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-15px, -15px) rotate(-5deg); }
            20% { transform: translate(15px, 15px) rotate(5deg); }
            30% { transform: translate(-15px, 15px) rotate(-5deg); }
            40% { transform: translate(15px, -15px) rotate(5deg); }
            50% { transform: translate(-15px, -15px) rotate(-5deg); }
            60% { transform: translate(15px, 15px) rotate(5deg); }
            70% { transform: translate(-15px, 15px) rotate(-5deg); }
            80% { transform: translate(15px, -15px) rotate(5deg); }
            90% { transform: translate(-15px, -15px) rotate(-5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        
        .message {
            font-size: 50px;
            margin-top: 20px;
            color: red;
            animation: flicker 0.3s infinite;
        }
        
        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 15px 30px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 18px;
            margin-top: 20px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            transition: background-color 0.3s;
        }
        
        .btn:hover {
            background-color: #3e8e41;
        }
    </style>
</head>
<body>
    <div class="intro" id="intro">
        <h1>Klik untuk melihat sesuatu yang keren!</h1>
        <p>Sebuah kejutan menarik untukmu...</p>
        <button class="btn" id="startButton">Lihat Sekarang</button>
    </div>
    
    <div class="jumpscare" id="jumpscare">
        <div class="jumpscare-content">
            <div class="scary-face">👹</div>
            <div class="message">YAHAHA HAYUUU!!!</div>
        </div>
    </div>

    <script>
        // Fungsi untuk mengaktifkan audio
        function prepareAndPlayAudio() {
            // Buat elemen audio
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            // Buat oscillator untuk suara menjerit
            const screamOscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            // Atur jenis dan frekuensi
            screamOscillator.type = 'sawtooth';
            screamOscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            screamOscillator.frequency.linearRampToValueAtTime(100, audioContext.currentTime + 0.5);
            
            // Atur volume yang sangat keras
            gainNode.gain.setValueAtTime(1, audioContext.currentTime);
            
            // Sambungkan node
            screamOscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            // Mulai dan hentikan suara
            screamOscillator.start();
            screamOscillator.stop(audioContext.currentTime + 1.5);
            
            // Buat suara ledakan keras setelahnya
            setTimeout(() => {
                const explosionOscillator = audioContext.createOscillator();
                const explosionGain = audioContext.createGain();
                
                explosionOscillator.type = 'square';
                explosionOscillator.frequency.setValueAtTime(50, audioContext.currentTime);
                explosionOscillator.frequency.linearRampToValueAtTime(20, audioContext.currentTime + 0.5);
                
                explosionGain.gain.setValueAtTime(1, audioContext.currentTime);
                explosionGain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1.5);
                
                explosionOscillator.connect(explosionGain);
                explosionGain.connect(audioContext.destination);
                
                explosionOscillator.start();
                explosionOscillator.stop(audioContext.currentTime + 1.5);
            }, 200);
        }

        // Tunggu interaksi pengguna
        document.getElementById('startButton').addEventListener('click', function() {
            // Sembunyikan intro
            document.getElementById('intro').style.display = 'none';
            
            // Tunda jumpscare untuk membuat kejutan
            setTimeout(function() {
                // Tampilkan jumpscare
                const jumpscareElement = document.getElementById('jumpscare');
                jumpscareElement.style.display = 'flex';
                
                // Putar suara keras
                prepareAndPlayAudio();
                
                // Ganti gambar setelah beberapa detik
                setTimeout(function() {
                    document.querySelector('.scary-face').innerHTML = '😱';
                    
                    // Putar suara tambahan
                    prepareAndPlayAudio();
                    
                    // Reset halaman setelah beberapa detik
                    setTimeout(function() {
                        location.reload();
                    }, 3000);
                }, 1500);
            }, 1000); // Tunggu 1 detik sebelum jumpscare
        });
    </script>
</body>
</html>
